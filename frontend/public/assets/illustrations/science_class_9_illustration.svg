<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_science_9" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad_science_9)" rx="20"/>
  
  <!-- Abstract Decorative Shapes -->
  <circle cx="35%" cy="65%" r="120" fill="#ffffff" opacity="0.1" />
  <circle cx="65%" cy="35%" r="80" fill="#ffffff" opacity="0.15" />
  <rect x="60%" y="55%" width="150" height="150" fill="#ffffff" opacity="0.1" rx="30" transform="rotate(135)" />
  
  <!-- Text Content -->
  <g text-anchor="middle" filter="url(#shadow)">
    <text x="400" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
      Science Olympiad
    </text>
    <text x="400" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#ffffff" opacity="0.9">
      Class 9
    </text>
    <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#ffffff" opacity="0.8">
      Explore, Learn, and Excel
    </text>
  </g>
</svg>