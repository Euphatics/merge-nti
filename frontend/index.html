<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"

  <meta name="theme-color" content="#1D4ED8" />
  <!--
    The Content-Security-Policy is served as a real header from .htaccess, which
    vite build generates with the correct API origin. A <meta> tag cannot set
    frame-ancestors, and hardcoding the backend URL here meant it drifted from
    VITE_API_URL every time the API moved.
  -->
  <!-- Google Fonts: Inter and Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
